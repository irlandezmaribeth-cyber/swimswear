<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saltline Swim</title>
<meta name="description" content="Saltline Swim: chlorine-resistant swimwear made to move. A demo e-commerce storefront built with vanilla HTML, CSS and JavaScript.">
<meta name="theme-color" content="#0B4A6F">

<!-- Favicons -->
<link rel="icon" href="assets/favicons/favicon.ico" sizes="48x48">
<link rel="icon" href="assets/favicons/favicon.svg" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicons/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/favicons/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="msapplication-config" content="browserconfig.xml">

<!-- Social preview -->
<meta property="og:type" content="website">
<meta property="og:title" content="Saltline Swim">
<meta property="og:description" content="Swimwear made to move. Chlorine-resistant fabric, recycled nylon, cuts that stay put.">
<meta property="og:image" content="assets/img/hero-umbrella-beach.jpg">
<meta name="twitter:card" content="summary_large_image">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header id="hd">
 <div class="top">
  <div class="srch"><input id="q" placeholder="Search swimwear" aria-label="Search" autocomplete="off"><span aria-hidden="true">⌕</span><div id="sg"></div></div>
  <button class="logo" data-a="go" data-v="home">SALTLINE</button>
  <div class="ic"><button data-a="acct" aria-label="Account">☺ <span>Account</span></button><button data-a="go" data-v="shop" data-c="Saved" aria-label="Saved items">♡<i id="wc">0</i></button><button data-a="cart" aria-label="Open bag">▣ <span>Bag</span><i id="cc">0</i></button></div>
 </div>
 <nav class="nav" id="nv"></nav>
</header>
<div id="v"></div>
<div class="ov" id="ov"><div class="bx" id="bx" role="dialog" aria-modal="true"></div></div>
<div class="scrim" id="sc"></div>
<aside id="dr" aria-label="Shopping bag"></aside>
<div id="gd"><div id="gp"></div><button id="gb" data-a="guide">Demo guide</button></div>
<div class="toast" id="ts" role="status"></div>

<!-- Scripts: order matters (shared globals). app.js boots the storefront. -->
<script src="js/utils.js"></script>
<script src="js/data.js"></script>
<script src="js/images.js"></script>
<script src="js/app.js"></script>
</body>
</html>
